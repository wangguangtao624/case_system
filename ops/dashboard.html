<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case System 运维</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f4f6f8,#11151b);color:light-dark(#192331,#e0e7ef)}body{max-width:1050px;margin:0 auto;padding:28px 20px}h1{font-size:24px}h2{font-size:18px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.panel{background:light-dark(#fff,#1c2430);border:1px solid light-dark(#dce2e9,#344052);border-radius:10px;padding:18px}.value{font-size:28px;font-variant-numeric:tabular-nums;margin:12px 0}small,.muted{color:light-dark(#526176,#afbdce)}progress{width:100%;height:12px;accent-color:#2e8c72}dt{margin-top:14px}dd{margin:5px 0;overflow-wrap:anywhere}#alerts{padding:14px;border-left:4px solid #b47b19;background:light-dark(#fff6e3,#362d1b)}.ok{border-left-color:#2e8c72!important}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid light-dark(#dce2e9,#344052)}code{overflow-wrap:anywhere}button{padding:8px 14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stale{color:light-dark(#a02626,#ff9e9e)}a{color:inherit}
</style></head><body><header><h1>Case System · 运维状态</h1><button id="refresh" type="button">刷新</button></header>
<p class="muted">12 生产 → 38 独立备份 / 开发 / 验证。采集每分钟一次，页面每 15 秒刷新。</p><p id="stamp">正在读取…</p><div id="alerts" role="status">等待采集</div>
<h2>服务器</h2><div class="grid"><section class="panel" id="production"></section><section class="panel" id="development"></section></div>
<h2>生产服务探测</h2><table><thead><tr><th>入口</th><th>结果</th><th>响应时间</th></tr></thead><tbody id="http"></tbody></table>
<h2>备份</h2><section class="panel"><dl id="backup"></dl></section>
<h2>恢复演练</h2><p id="drill">等待结果</p><h2>最近状态变化</h2><div id="events"></div><p class="muted">本面板只读。告警记录在本机，尚未配置聊天、短信或邮件推送。HTTP 正常不代表所有业务正常；数据恢复、权限和关键流程仍需专项验证。</p>
<script>
const gib=v=>(v/1073741824).toFixed(2)+' GiB';
const date=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）':'尚未完成';
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}
function host(id,title,m){const el=document.getElementById(id);el.replaceChildren(node('h3',title));if(!m||m.error){el.append(node('p',m?.error?'采集失败':'尚未配置'));return;}el.append(node('div',gib(m.memory_available)+' 可用'));const p=document.createElement('progress');p.max=m.memory_total;p.value=m.memory_total-m.memory_available;p.setAttribute('aria-label',title+' 内存不可用比例');el.append(p,node('p','总内存 '+gib(m.memory_total)),node('p','磁盘 '+gib(m.disk_used)+' / '+gib(m.disk_total)),node('p','Swap '+gib(m.swap_used)),node('p','负载 '+m.load.map(x=>x.toFixed(2)).join(' / ')));}
async function update(){try{const [r,e]=await Promise.all([fetch('/status.json',{cache:'no-store'}),fetch('/events.json',{cache:'no-store'})]);if(!r.ok||!e.ok)throw Error('HTTP');const s=await r.json(),events=await e.json();const stale=!s.sampled_at||Date.now()-Date.parse(s.sampled_at)>180000;const stamp=document.getElementById('stamp');stamp.textContent='最近采集：'+date(s.sampled_at)+(stale?' · 数据已过期':'');stamp.className=stale?'stale':'';const alerts=document.getElementById('alerts');const messages=[...(s.alerts||[])];if(stale)messages.unshift('监控采集超过 3 分钟未更新');alerts.textContent=messages.length?messages.join('；'):'当前探测未发现告警';alerts.className=messages.length?'':'ok';host('production','10.26.10.12 · 生产',s.production);host('development','10.26.10.38 · 开发与备份',s.development);const http=document.getElementById('http');http.replaceChildren();for(const [name,v]of Object.entries(s.http||{})){const tr=document.createElement('tr');tr.append(node('td',name),node('td',v.ok?'正常 · HTTP '+v.status:'失败 · '+(v.status||v.error)),node('td',v.ms+' ms'));http.append(tr);}document.getElementById('drill').textContent=s.restore_drill?.finished_at?(date(s.restore_drill.finished_at)+' · '+(s.restore_drill.ok?'数据库与附件恢复校验通过（业务验收另行执行）':'失败')):'尚未记录定期演练';const b=s.backup||{},dl=document.getElementById('backup');dl.replaceChildren();for(const [k,v]of [['本地备份校验',date(b.local?.verified_at)],['38 备份校验',date(b.remote?.verified_at)],['远程快照',b.remote?.snapshot||'尚无'],['附件引用数',String(b.remote?.attachments??b.local?.attachments??'未知')],['执行状态',b.running?'执行中':b.error?'失败：'+b.error:'最近任务完成'],['校验范围','数据库完整性、表行数、文件 SHA-256、附件引用存在性']])dl.append(node('dt',k),node('dd',v));const ev=document.getElementById('events');ev.replaceChildren();for(const item of (Array.isArray(events)?events:[]).slice(-8).reverse())ev.append(node('p',date(item.at)+' · '+(item.alerts.length?item.alerts.join('；'):'告警恢复')));}catch(_){document.getElementById('stamp').textContent='无法读取监控数据';document.getElementById('stamp').className='stale';document.getElementById('alerts').textContent='面板连接异常，当前状态未知';}}
document.getElementById('refresh').addEventListener('click',update);update();setInterval(update,15000);
</script></body></html>
